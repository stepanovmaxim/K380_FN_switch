name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # build.cmd locates the toolchain through vswhere, so no extra setup step
      - name: Build
        shell: cmd
        run: build.cmd

      - name: Report size
        shell: pwsh
        run: |
          $exe = Get-Item K380_FN_switch.exe
          "$($exe.Name): $($exe.Length) bytes" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: K380_FN_switch
          path: K380_FN_switch.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:GITHUB_REF_NAME K380_FN_switch.exe --clobber
